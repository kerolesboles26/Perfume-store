<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Perfume Store</title>
    <meta name="description" content="Login to your Perfume Store account to track your orders, manage your wishlist and access exclusive member offers.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header id="siteHeader"></header>
    <main class="auth-page">
        <section class="auth-card">
            <span class="eyebrow">Welcome Back</span>
            <h1>Perfume Store</h1>
            <h2 data-i18n="login">Login</h2>
            <form id="loginForm">
                <label for="email" data-i18n="email">Email</label><input type="email" id="email" required>
                <label for="password" data-i18n="password">Password</label><input type="password" id="password"
                    required>

                    <a href="forgot-password.html"
                    class="forgot-password"
                    data-i18n="forgotPassword">
                        Forgot Password?
                </a>
                <button type="submit" data-i18n="login">Login</button>
                
                <div class="social-divider">
                    <span data-i18n="orContinueWith">Or continue with</span>
                </div>
                
                <div class="social-login">
                    <button type="button" class="google-btn" id="googleLogin">
                        <span>G</span>
                        <span data-i18n="continueGoogle">
                            Continue with Google
                        </span>
                    </button>
                </div>

                <p><span data-i18n="noAccount">Don't have an account?</span> <a href="register.html"
                        data-i18n="register">Create Account</a></p>
            </form>
        </section>
    </main>
    <footer id="siteFooter"></footer>
    <script type="module" src="./firebase-auth.js"></script>
    <script src="./app.js"></script>
</body>

</html>
