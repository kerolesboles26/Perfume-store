<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfume Store - Admin Dashboard</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./admin.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-brand">
                <h2>Royal Admin</h2>
            </div>
            <nav class="admin-nav">
                <a href="#" class="active" data-view="dashboard">Dashboard</a>
            </nav>
            <div class="admin-logout">
                <a href="index.html">← Back to Store</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <h1>Overview</h1>
                <div class="admin-user">Admin Panel</div>
            </header>

            <div class="admin-content" id="adminContent">
                <!-- Dashboard View -->
                <div class="admin-view active" id="view-dashboard">
                    <div class="metrics-grid">
                        <div class="metric-card">
                            <h3>Total Sales</h3>
                            <div class="metric-value" id="metricSales">0 EGP</div>
                        </div>
                        <div class="metric-card">
                            <h3>Total Orders</h3>
                            <div class="metric-value" id="metricOrders">0</div>
                        </div>
                        <div class="metric-card">
                            <h3>Customers</h3>
                            <div class="metric-value" id="metricCustomers">0</div>
                        </div>
                    </div>

                    <div class="recent-orders-section">
                        <h2>Recent Orders</h2>
                        <div class="admin-table-wrapper">
                            <table class="admin-table">
                                <thead>
                                    <tr>
                                        <th>Order ID</th>
                                        <th>Customer</th>
                                        <th>Date</th>
                                        <th>Total</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="adminOrdersTableBody">
                                    <!-- Orders will be injected here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="./firebase-auth.js"></script>
    <script src="./admin.js" type="module"></script>
</body>
</html>
