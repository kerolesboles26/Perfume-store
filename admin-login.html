<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access | Kero Perfume 🔐</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --gold: #d4a843;
            --gold-bright: #f0c050;
            --gold-gradient: linear-gradient(135deg, #a07828 0%, #d4a843 40%, #f0c050 70%, #fde38a 100%);
            --gold-glow: 0 0 30px rgba(212,168,67,0.4), 0 0 60px rgba(212,168,67,0.15);
            --bg: #03040a;
            --card: rgba(12, 14, 24, 0.9);
            --border: rgba(212,168,67,0.25);
            --text: #f0f1f8;
            --muted: #7a85a8;
            --error: #ff4d6d;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
        }
        .orb-1 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(212,168,67,0.25) 0%, transparent 70%);
            top: -150px; left: -150px;
            animation: float1 16s ease-in-out infinite;
        }
        .orb-2 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(160,120,40,0.18) 0%, transparent 70%);
            bottom: -100px; right: -100px;
            animation: float2 20s ease-in-out infinite;
        }
        @keyframes float1 { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(50px, 40px); } }
        @keyframes float2 { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(-40px, -30px); } }

        .lock-icon {
            font-size: 3.5rem;
            margin-bottom: 8px;
            animation: lockPulse 3s ease-in-out infinite;
            display: block;
        }
        @keyframes lockPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(212,168,67,0.4)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 20px rgba(212,168,67,0.7)); }
        }

        .login-card {
            position: relative;
            z-index: 1;
            background: var(--card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 50px 44px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 24px 70px rgba(0,0,0,0.7), var(--gold-glow);
            text-align: center;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--gold-gradient);
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            margin-bottom: 4px;
        }

        .brand-sub {
            font-size: 0.82rem;
            color: var(--muted);
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-bottom: 36px;
        }

        .form-group { text-align: left; margin-bottom: 18px; }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: 7px;
        }

        .input-wrapper { position: relative; }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            background: #0d0f1b !important;
            border: 1px solid var(--border) !important;
            border-radius: 12px;
            padding: 13px 16px 13px 42px;
            color: #ffffff !important;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        /* Chrome/Edge Autofill Override to prevent transparent or white background */
        .form-group input:-webkit-autofill,
        .form-group input:-webkit-autofill:hover, 
        .form-group input:-webkit-autofill:focus, 
        .form-group input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px #0d0f1b inset !important;
            -webkit-text-fill-color: #ffffff !important;
            border: 1px solid #d4a843 !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .form-group input:focus {
            border-color: var(--gold-bright) !important;
            box-shadow: 0 0 0 3px rgba(212,168,67,0.15), 0 0 20px rgba(212,168,67,0.2);
        }

        .form-group input::placeholder { color: #7a85a8 !important; }

        .eye-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--muted);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--gold-gradient);
            color: #06070e;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 24px rgba(212,168,67,0.35);
        }

        .btn-login::after {
            content: '';
            position: absolute;
            top: -50%; left: -75%;
            width: 50%; height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-20deg);
            transition: left 0.6s ease;
        }
        .btn-login:hover::after { left: 125%; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(212,168,67,0.55); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .alert {
            display: none;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 18px;
            text-align: left;
        }
        .alert.error { background: rgba(255,77,109,0.1); border: 1px solid rgba(255,77,109,0.35); color: #ff6b86; }
        .alert.success { background: rgba(37,211,102,0.1); border: 1px solid rgba(37,211,102,0.35); color: #25D366; }

        .spinner {
            display: inline-block;
            width: 18px; height: 18px;
            border: 2px solid rgba(0,0,0,0.3);
            border-top-color: #06070e;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .security-note {
            margin-top: 28px;
            font-size: 0.78rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }
        .shake { animation: shake 0.5s ease; }

        .denied-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(3,4,10,0.97);
            z-index: 100;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
        }
        .denied-overlay.show { display: flex; }
        .denied-icon { font-size: 5rem; margin-bottom: 16px; }
        .denied-title { font-family: 'Cinzel', serif; font-size: 2rem; color: var(--error); margin-bottom: 8px; }
        .denied-sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 24px; }
        .denied-back {
            padding: 10px 24px;
            background: rgba(255,77,109,0.15);
            border: 1px solid rgba(255,77,109,0.4);
            color: var(--error);
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="login-card" id="loginCard">
        <span class="lock-icon">🔐</span>
        <div class="brand-title">Kero Perfume</div>
        <div class="brand-sub">Admin Access Only</div>

        <div class="alert error" id="errorAlert"></div>
        <div class="alert success" id="successAlert"></div>

        <form id="adminLoginForm" autocomplete="off">
            <div class="form-group">
                <label for="adminEmail">Admin Email</label>
                <div class="input-wrapper">
                    <span class="input-icon">📧</span>
                    <input type="email" id="adminEmail" placeholder="Enter Admin Email" required autocomplete="off" value="">
                </div>
            </div>
            <div class="form-group">
                <label for="adminPassword">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔑</span>
                    <input type="password" id="adminPassword" placeholder="••••••••••" required autocomplete="new-password" value="">
                    <button type="button" class="eye-btn" id="eyeBtn">👁️</button>
                </div>
            </div>
            <button class="btn-login" type="submit" id="loginBtn">🛡️ Enter Admin Panel</button>
        </form>

        <div class="security-note">🔒 Secured by Firebase Authentication</div>
    </div>

    <div class="denied-overlay" id="deniedOverlay">
        <div class="denied-icon">🚫</div>
        <div class="denied-title">Access Denied</div>
        <div class="denied-sub">This account is not authorized to access the admin panel.</div>
        <button class="denied-back" id="tryAgainBtn">← Try Again</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBR49WEI0FFXjmt-yCE5-9fxudrKU_ELPY",
            authDomain: "perfume-store-8f0fe.firebaseapp.com",
            projectId: "perfume-store-8f0fe",
            storageBucket: "perfume-store-8f0fe.firebasestorage.app",
            messagingSenderId: "990271556023",
            appId: "1:990271556023:web:62542b8c49799782ab0032"
        };

        const ADMIN_EMAIL = "admin@keroperfume.com";
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Already logged in as admin in current session? skip login
        onAuthStateChanged(auth, (user) => {
            if (user && user.email === ADMIN_EMAIL && sessionStorage.getItem("admin_login_verified") === "true") {
                window.location.href = "admin.html";
            }
        });

        const form = document.getElementById("adminLoginForm");
        const btn = document.getElementById("loginBtn");
        const errorAlert = document.getElementById("errorAlert");
        const successAlert = document.getElementById("successAlert");
        const card = document.getElementById("loginCard");
        const deniedOverlay = document.getElementById("deniedOverlay");

        // Clear input fields on load
        if (form) form.reset();

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("adminEmail").value.trim();
            const password = document.getElementById("adminPassword").value;

            errorAlert.style.display = "none";
            successAlert.style.display = "none";

            // Block non-admin emails immediately
            if (email !== ADMIN_EMAIL) {
                deniedOverlay.classList.add("show");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Verifying...';

            try {
                // First attempt normal sign in
                await signInWithEmailAndPassword(auth, email, password);
                sessionStorage.setItem("admin_login_verified", "true");
                successAlert.textContent = "✅ Access granted! Redirecting...";
                successAlert.style.display = "block";
                setTimeout(() => { window.location.href = "admin.html"; }, 1000);
            } catch (err) {
                // If user not registered yet in Firebase Auth, create the admin user on first run
                if (err.code === "auth/user-not-found" || err.code === "auth/invalid-credential") {
                    try {
                        await createUserWithEmailAndPassword(auth, email, password);
                        sessionStorage.setItem("admin_login_verified", "true");
                        successAlert.textContent = "👑 Welcome Admin! Account activated. Redirecting...";
                        successAlert.style.display = "block";
                        setTimeout(() => { window.location.href = "admin.html"; }, 1000);
                        return;
                    } catch (createErr) {
                        // If creation fails because user already exists (meaning wrong password was entered)
                        if (createErr.code === "auth/email-already-in-use") {
                            // Wrong password entered
                        }
                    }
                }

                btn.disabled = false;
                btn.innerHTML = '🛡️ Enter Admin Panel';

                let msg = "❌ Wrong password. Access denied.";
                if (err.code === "auth/too-many-requests") msg = "⚠️ Too many attempts. Try again later.";

                errorAlert.textContent = msg;
                errorAlert.style.display = "block";
                card.classList.add("shake");
                setTimeout(() => card.classList.remove("shake"), 600);
            }
        });

        document.getElementById("tryAgainBtn").addEventListener("click", () => {
            deniedOverlay.classList.remove("show");
            document.getElementById("adminEmail").value = "";
            document.getElementById("adminPassword").value = "";
            btn.disabled = false;
            btn.innerHTML = '🛡️ Enter Admin Panel';
        });

        document.getElementById("eyeBtn").addEventListener("click", () => {
            const input = document.getElementById("adminPassword");
            const eyeBtn = document.getElementById("eyeBtn");
            if (input.type === "password") { input.type = "text"; eyeBtn.textContent = "🙈"; }
            else { input.type = "password"; eyeBtn.textContent = "👁️"; }
        });
    </script>
</body>
</html>
