<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfume Store - Forgot Password</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header id="siteHeader" class="forgot-header"></header>
    <main class="auth-page">

        <section class="auth-card">

            <span class="eyebrow" data-i18n="forgotPassword">
                Forgot Password
            </span>

            <h1>Perfume Store</h1>

            <h2 data-i18n="resetPassword">
                Reset Password
            </h2>

            <p class="forgot-description" data-i18n="forgotDescription">
                Enter your email address and we will send you a link to reset your password.
            </p>

            <form id="forgotPasswordForm">

                <label for="resetEmail" data-i18n="email">
                    Email
                </label>

                <input
                    type="email"
                    id="resetEmail"
                    required
                    data-i18n-placeholder="emailPlaceholder"
                    placeholder="Enter your email"
                >

                <button type="submit" data-i18n="sendResetEmail">
                    Send Reset Email
                </button>

            </form>

            <p class="back-login">
                <a href="login.html" data-i18n="backToLogin">
                    ← Back to Login
                </a>
            </p>

        </section>

    </main>

    <footer id="siteFooter" class="forgot-footer"></footer>
    <script src="./app.js"></script>
    <script type="module" src="./firebase-auth.js"></script>

</body>

</html>
